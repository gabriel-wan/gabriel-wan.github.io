	<!-- Scripts -->
	<script src="js/jquery.min.js"></script>

	<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

	<script>
		particlesJS("particles-js", {
			"particles": {
				"number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
				"color": { "value": "#a7c8ff" },
				"shape": { "type": "circle" },
				"opacity": { "value": 0.4, "random": false },
				"size": { "value": 3, "random": true },
				"line_linked": { "enable": true, "distance": 150, "color": "#5b8cff", "opacity": 0.24, "width": 1 },
				"move": { "enable": true, "speed": 3, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
			},
			"retina_detect": true
		});

		const typewriterPhrases = ["working software", "practical products", "useful tools"];
		const typewriterText = document.getElementById("typewriter-text");
		const typewriterCursor = document.querySelector(".typewriter-container .cursor");
		const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
		let phraseIndex = 0;
		let letterIndex = typewriterPhrases[0].length;
		let isDeleting = true;

		function typeHeroPhrase() {
			const phrase = typewriterPhrases[phraseIndex];

			if (isDeleting) letterIndex--;
			else letterIndex++;

			typewriterText.textContent = phrase.substring(0, letterIndex);

			if (!isDeleting && letterIndex === phrase.length) {
				isDeleting = true;
				setTimeout(typeHeroPhrase, 1800);
				return;
			}

			if (isDeleting && letterIndex === 0) {
				isDeleting = false;
				phraseIndex = (phraseIndex + 1) % typewriterPhrases.length;
			}

			setTimeout(typeHeroPhrase, isDeleting ? 45 : 85);
		}

		if (reduceMotion) {
			typewriterText.textContent = typewriterPhrases[0];
			typewriterCursor.hidden = true;
		} else {
			setTimeout(typeHeroPhrase, 1800);
		}
	</script>

</body>
